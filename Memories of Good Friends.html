<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我們的專屬回憶錄</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;700&display=swap');
        
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background: #fdf6f6;
            color: #4a4a4a;
            scroll-behavior: smooth;
        }

        .hero-gradient {
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
        }

        .card-glass {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .birthday-tag {
            background: linear-gradient(90deg, #ffecd2 0%, #fcb69f 100%);
        }
    </style>
</head>
<body>

    <!-- 頂部導航 -->
    <nav class="sticky top-0 z-50 card-glass p-4 flex justify-between items-center max-w-6xl mx-auto rounded-b-2xl shadow-sm">
        <div class="text-xl font-bold text-pink-500 px-2"><i class="fas fa-heart mr-2"></i>我們的回憶</div>
        <div class="space-x-3 md:space-x-6 text-sm md:text-base">
            <a href="#birthdays" class="hover:text-pink-500 font-medium">重要生日</a>
            <a href="#counter" class="hover:text-pink-500 font-medium">認識天數</a>
        </div>
    </nav>

    <!-- 主視覺區 -->
    <header class="hero-gradient text-white py-20 px-6 text-center shadow-inner">
        <h1 class="text-3xl md:text-5xl font-bold mb-4">這是一段關於我們的故事</h1>
        <p class="text-lg opacity-90 italic">記錄每一份相遇的溫暖</p>
    </header>

    <main class="max-w-6xl mx-auto px-6 -mt-10">
        
        <!-- 生日區塊 -->
        <section id="birthdays" class="mb-12">
            <div class="card-glass p-8 rounded-3xl shadow-xl border-t-4 border-pink-400">
                <h2 class="text-2xl font-bold mb-6 text-pink-600 flex items-center">
                    <i class="fas fa-birthday-cake mr-3"></i>重要生日
                </h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4" id="birthday-list">
                    <!-- 生日項目由 JS 生成 -->
                </div>
            </div>
        </section>

        <!-- 計數器區塊 -->
        <section id="counter" class="mb-20">
            <div class="card-glass p-8 rounded-3xl shadow-xl border-t-4 border-indigo-400">
                <h2 class="text-2xl font-bold mb-6 text-indigo-600 flex items-center">
                    <i class="fas fa-user-friends mr-3"></i>我們認識了多久？
                </h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6" id="friendship-list">
                    <!-- 認識天數項目由 JS 生成 -->
                </div>
            </div>
        </section>

    </main>

    <footer class="text-center py-10 text-gray-400 text-sm">
        &copy; 2024 專屬於我們的回憶錄 | Made with ❤️
    </footer>

    <script>
        // 1. 生日資料
        const birthdays = [
            { name: "張家軒", month: 4, day: 13 },
            { name: "洪翊菖", month: 6, day: 28 },
            { name: "陳芊如", month: 7, day: 8 },
            { name: "劉宜姍", month: 9, day: 13 },
            { name: "林郁庭", month: 9, day: 26 },
            { name: "藍仲庭", month: 11, day: 27 }
        ];

        // 2. 認識日期資料 (已移除其他回憶)
        const friendships = [
            { pair: "洪翊菖 & 張家軒", date: "2024-06-09" },
            { pair: "洪翊菖 & 林郁庭", date: "2020-03-20" },
            { pair: "林郁庭 & 陳芊如", date: "2024-09-06" },
            { pair: "林郁庭 & 藍仲庭", date: "2024-09-06" }
        ];

        // 計算天數與生日邏輯
        function initData() {
            const now = new Date();
            const bdayList = document.getElementById('birthday-list');
            const friendList = document.getElementById('friendship-list');

            // 處理生日
            birthdays.forEach(person => {
                let nextBday = new Date(now.getFullYear(), person.month - 1, person.day);
                if (now > nextBday) {
                    nextBday.setFullYear(now.getFullYear() + 1);
                }
                const diff = Math.ceil((nextBday - now) / (1000 * 60 * 60 * 24));
                
                const card = document.createElement('div');
                card.className = "p-4 rounded-xl border border-pink-100 birthday-tag flex justify-between items-center shadow-sm";
                card.innerHTML = `
                    <div>
                        <div class="font-bold text-gray-800">${person.name}</div>
                        <div class="text-xs text-gray-600">${person.month}月${person.day}日</div>
                    </div>
                    <div class="text-right">
                        <div class="text-sm font-bold text-pink-700">剩 ${diff} 天</div>
                        <div class="text-[10px] text-pink-600 uppercase font-bold">Birthday</div>
                    </div>
                `;
                bdayList.appendChild(card);
            });

            // 處理認識天數
            friendships.forEach(item => {
                const startDate = new Date(item.date);
                const diffTime = Math.abs(now - startDate);
                const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));

                const card = document.createElement('div');
                card.className = "p-6 rounded-2xl bg-white border border-indigo-50 shadow-sm hover:shadow-md transition-shadow";
                card.innerHTML = `
                    <div class="text-sm text-indigo-400 font-bold mb-1">${item.pair}</div>
                    <div class="text-3xl font-bold text-gray-700">${diffDays} <span class="text-lg font-normal">天</span></div>
                    <div class="text-[10px] text-gray-400 mt-2 italic font-sans">Since ${item.date}</div>
                `;
                friendList.appendChild(card);
            });
        }

        // 初始化
        initData();
    </script>
</body>
</html>
