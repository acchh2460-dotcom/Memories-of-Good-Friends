<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我們的專屬多媒體回憶錄</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;700&display=swap');
        
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background: #fdf6f6;
            color: #4a4a4a;
            scroll-behavior: smooth;
        }

        .hero-gradient {
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
        }

        .card-glass {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        /* 媒體卡片動畫 */
        .media-card {
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            break-inside: avoid;
        }
        .media-card:hover {
            transform: scale(1.02);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        /* 燈箱樣式 */
        #lightbox {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        /* 瀑布流佈局 */
        .masonry-grid {
            column-count: 2;
            column-gap: 1.5rem;
        }
        @media (min-width: 768px) { .masonry-grid { column-count: 3; } }
        @media (min-width: 1024px) { .masonry-grid { column-count: 4; } }

        /* 個人專區樣式 */
        .member-avatar {
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            border: 3px solid white;
            background: #fff5f5;
        }
        .member-card:hover .member-avatar {
            transform: translateY(-8px);
            box-shadow: 0 15px 25px -5px rgba(255, 154, 158, 0.5);
            border-color: #ff9a9e;
        }
        .member-avatar i {
            font-size: 2.5rem;
            color: #ffd1d1;
        }

        /* 滾動條美化 */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #ffb6c1; border-radius: 10px; }
    </style>
</head>
<body>

    <!-- 頂部導覽 -->
    <nav class="sticky top-0 z-50 card-glass p-4 flex justify-between items-center max-w-6xl mx-auto rounded-b-2xl shadow-sm">
        <div class="flex flex-col">
            <div class="text-xl font-bold text-pink-500 px-2"><i class="fas fa-heart mr-2"></i>我們的回憶</div>
        </div>
        <div class="space-x-4 text-sm md:text-base">
            <a href="#birthdays" class="hover:text-pink-500 font-medium">生日</a>
            <a href="#personal-zone" class="hover:text-pink-500 font-medium">好朋友專區</a>
            <a href="#gallery-section" class="hover:text-pink-500 font-medium">歡樂合照</a>
        </div>
    </nav>

    <!-- 主視覺區 -->
    <header class="hero-gradient text-white py-20 px-6 text-center shadow-inner">
        <h1 class="text-4xl md:text-6xl font-bold mb-4">回憶紀錄牆</h1>
        <p class="text-lg opacity-90 italic">珍藏每個人的獨特瞬間</p>
    </header>

    <main class="max-w-7xl mx-auto px-6 -mt-10">
        
        <!-- 生日區塊 -->
        <section id="birthdays" class="mb-12">
            <div class="card-glass p-8 rounded-3xl shadow-xl border-t-4 border-pink-400">
                <h2 class="text-2xl font-bold mb-6 text-pink-600 flex items-center">
                    <i class="fas fa-birthday-cake mr-3"></i>近期生日提醒
                </h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4" id="birthday-list"></div>
            </div>
        </section>

        <!-- 個人專區 -->
        <section id="personal-zone" class="mb-20">
            <div class="text-center mb-10">
                <h2 class="text-3xl font-bold text-gray-800">✨ 好朋友專屬櫥窗</h2>
                <p class="text-gray-500 mt-2 italic">目前尚未上傳個人封面照</p>
            </div>
            
            <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-6" id="member-grid">
                <!-- 由 JS 動態生成 -->
            </div>
        </section>

        <hr class="border-gray-200 mb-20">

        <!-- 合照影音牆 -->
        <section id="gallery-section" class="mb-20">
            <div class="text-center mb-10">
                <h2 class="text-3xl font-bold text-gray-800">📸 歡樂合照牆</h2>
                <p class="text-gray-400 mt-2">回憶準備中...</p>
            </div>

            <div class="masonry-grid" id="gallery-container">
                <div class="col-span-full py-20 text-center text-gray-300 italic">
                    <i class="fas fa-images text-5xl mb-4 block"></i>
                    尚未有公開合照
                </div>
            </div>
        </section>

    </main>

    <!-- 燈箱 -->
    <div id="lightbox" onclick="closeLightbox()">
        <div class="relative max-w-[95vw] max-h-[90vh] flex flex-col items-center justify-center p-4">
            <div id="lightbox-content" class="rounded-lg overflow-hidden shadow-2xl bg-black w-full flex justify-center mb-4 border border-white/20"></div>
            <div id="lightbox-caption" class="text-white text-lg font-bold text-center"></div>
            <div id="lightbox-subcaption" class="text-pink-300 text-sm mt-2"></div>
            <button class="absolute -top-12 right-0 text-white text-3xl hover:text-pink-400 transition-colors">
                <i class="fas fa-times"></i>
            </button>
        </div>
    </div>

    <script>
        // 好朋友名單
        const members = ["林郁庭", "洪翊菖", "藍仲庭", "劉宜姍", "陳芊如", "張家軒"];
        
        // 個人封面設定 (已清空)
        const memberCovers = {};

        // 相識紀念日資料
        const meetingAnniversaries = {
            "林郁庭": "2020/03/20 認識洪翊菖 | 2024/09/06 認識陳芊如 & 藍仲庭",
            "洪翊菖": "2020/03/20 認識林郁庭 | 2024/06/09 認識張家軒",
            "陳芊如": "2024/09/06 認識林郁庭",
            "張家軒": "2024/06/09 認識洪翊菖",
            "藍仲庭": "2024/09/06 認識林郁庭",
            "劉宜姍": "相識於美好的緣分"
        };

        const birthdays = [
            { name: "張家軒", month: 4, day: 13 },
            { name: "洪翊菖", month: 6, day: 28 },
            { name: "陳芊如", month: 7, day: 8 },
            { name: "劉宜姍", month: 9, day: 13 },
            { name: "林郁庭", month: 9, day: 26 },
            { name: "藍仲庭", month: 11, day: 27 }
        ];

        // 媒體資料 (已清空)
        const mediaData = [];

        function initMemberGrid() {
            const grid = document.getElementById('member-grid');
            grid.innerHTML = '';
            members.forEach(name => {
                const card = document.createElement('div');
                card.className = "member-card text-center cursor-pointer group";
                card.onclick = () => showMemberGallery(name);
                
                const coverSrc = memberCovers[name];
                const anniversary = meetingAnniversaries[name] || "相識紀念";
                const avatarHtml = `<i class="fas fa-user"></i>`;

                card.innerHTML = `
                    <div class="member-avatar w-full aspect-square rounded-full mb-4 flex items-center justify-center shadow-lg overflow-hidden mx-auto border-2 border-dashed border-pink-200">
                        ${avatarHtml}
                    </div>
                    <div class="font-bold text-gray-700 text-lg group-hover:text-pink-500 transition-colors">${name}</div>
                    <div class="text-[9px] text-pink-400 font-bold uppercase tracking-tighter mt-1 bg-pink-50 px-2 py-0.5 rounded-full inline-block">
                        <i class="fas fa-calendar-alt mr-1"></i>${anniversary.split('|')[0]}
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function showMemberGallery(name) {
            const anniversary = meetingAnniversaries[name] || "";
            openLightbox('image', null, `${name} 的個人特輯`, anniversary);
        }

        function renderGallery() {
            const container = document.getElementById('gallery-container');
            // 此處保持原有邏輯，但因為 mediaData 為空，所以不會渲染圖片
            if (mediaData.filter(item => !item.isPersonal).length === 0) {
                return; 
            }
            container.innerHTML = '';
        }

        function openLightbox(type, src, caption, subcaption = "") {
            const content = document.getElementById('lightbox-content');
            const cap = document.getElementById('lightbox-caption');
            const subcap = document.getElementById('lightbox-subcaption');
            const lightbox = document.getElementById('lightbox');
            
            cap.innerText = caption || "";
            subcap.innerText = subcaption || "";
            
            if (!src) {
                content.innerHTML = `<div class="p-20 text-white italic text-center">
                    <i class="fas fa-camera-retro text-4xl mb-4 block text-pink-500"></i>
                    照片整理中，敬請期待...
                </div>`;
            } else if (type === 'image') {
                content.innerHTML = `<img src="${src}" class="max-w-full max-h-[70vh] object-contain">`;
            } else {
                content.innerHTML = `<video controls autoplay class="max-w-full max-h-[70vh] bg-black"><source src="${src}" type="video/mp4"></video>`;
            }
            lightbox.style.display = 'flex';
        }

        function closeLightbox() {
            document.getElementById('lightbox').style.display = 'none';
            document.getElementById('lightbox-content').innerHTML = '';
        }

        function initBirthdays() {
            const now = new Date();
            const list = document.getElementById('birthday-list');
            list.innerHTML = '';
            const sorted = [...birthdays].sort((a, b) => {
                let da = new Date(now.getFullYear(), a.month - 1, a.day);
                let db = new Date(now.getFullYear(), b.month - 1, b.day);
                if (da < now) da.setFullYear(now.getFullYear() + 1);
                if (db < now) db.setFullYear(now.getFullYear() + 1);
                return da - db;
            });

            sorted.forEach(p => {
                let next = new Date(now.getFullYear(), p.month - 1, p.day);
                if (now > next) next.setFullYear(now.getFullYear() + 1);
                const diff = Math.ceil((next - now) / (1000 * 60 * 60 * 24));
                const card = document.createElement('div');
                card.className = "p-4 rounded-xl border border-pink-100 bg-white flex justify-between items-center shadow-sm hover:border-pink-300 transition-colors";
                card.innerHTML = `<div><div class="font-bold text-gray-800">${p.name}</div><div class="text-xs text-gray-500">${p.month}/${p.day}</div></div><div class="text-pink-500 font-bold text-sm">剩 ${diff} 天</div>`;
                list.appendChild(card);
            });
        }

        window.onload = () => {
            initBirthdays();
            initMemberGrid();
            renderGallery();
        };
    </script>
</body>
</html>
